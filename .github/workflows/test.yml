name: Source regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install "numpy==1.26.4" "scipy==1.13.1" "gemmi==0.7.5" "pytest==8.3.5"
      - name: Run synthetic and contract tests (no external engines)
        run: python -B -m pytest -q -p no:cacheprovider tests
      - name: Check CLI and source package
        run: |
          python -B run_gui.py --help
          python -B run_build_from_phases.py --help
          python -B package_gui.py --output dist/phasebuild-source.zip
