[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phasebuild"
version = "0.8.3"
description = "OASIS4.3-Build: phase-guided protein model building with PhaseBuild"
readme = "README.md"
license = {text = "LGPL-2.1-or-later"}
authors = [{name = "DingWei (丁玮)", email = "dingwei@iphy.ac.cn"}]
requires-python = ">=3.12,<3.13"
dependencies = ["gemmi==0.7.5", "numpy>=1.26,<2", "scipy>=1.12"]

[project.scripts]
phasebuild = "phasebuild.cli:main"
oasis43-gui = "phasebuild.desktop:main"
oasis-py = "oasis_py.cli:main"

[tool.setuptools.package-data]
oasis_py = ["resources/*.json", "resources/*.md", "resources/*.gz", "resources/licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
# Optional helpers that are NOT part of the scientific core and are not shipped
# in the pruned portable bundle. Install them yourself, e.g.
#   python -m pip install ".[gui]"     legacy Qt front end (oasis_py.gui)
#   python -m pip install ".[test]"    test runner only
gui = ["PySide6>=6.5"]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/WeiDing535/OASIS4.3-Build"
Issues = "https://github.com/WeiDing535/OASIS4.3-Build/issues"

[tool.oasis43]
version = "4.3.0.dev13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not reference_data'"
markers = ["reference_data: requires separately provisioned upstream reference data"]
